name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Formatting and lints are gates, not suggestions: the workspace was
      # unformatted and unlinted for a while because nothing enforced either.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  studio:
    name: studio e2e (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The suite drives the real binary in headless Chrome over CDP. It has no
      # npm dependencies: node runs the files directly.
      - name: Build the studio
        run: cargo build --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Studio end-to-end suite
        run: node --test "tests/ui/*.test.mjs"
        env:
          SLYDE_BIN: target/debug/slyde.exe
