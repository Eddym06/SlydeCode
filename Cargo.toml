[workspace]
resolver = "3"
members = [
    "crates/slyde-core",
    "crates/slyde-server",
    "crates/slyde-export",
    "crates/slyde-pptx",
    "crates/slyde-mcp",
    "crates/slyde-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["SlydeCode"]
license = "MIT"

[workspace.dependencies]
slyde-core = { path = "crates/slyde-core" }
slyde-server = { path = "crates/slyde-server" }
slyde-export = { path = "crates/slyde-export" }
slyde-mcp = { path = "crates/slyde-mcp" }
slyde-pptx = { path = "crates/slyde-pptx" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "signal", "fs", "io-util", "io-std"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tokio-tungstenite = "0.30"
# Provider transports. rustls keeps the binary free of an OpenSSL runtime
# dependency on Windows, macOS and Linux.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"
# PDF/DOCX/PPTX text extraction for copilot attachments.
pdf-extract = "0.12"
# OS entropy for session tokens. Tiny, audited, and already a transitive
# dependency of `uuid`; hand-rolled entropy has no place in a session secret.
getrandom = "0.3"
