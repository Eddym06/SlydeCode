[package]
name = "slyde-app"
description = "SlydeCode launcher binary: desktop app shell and MCP entrypoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "slyde_app"
path = "src/lib.rs"

[[bin]]
name = "slyde"
path = "src/main.rs"

[[bin]]
name = "slydecode"
path = "src/bin/slydecode.rs"

[dependencies]
slyde-core.workspace = true
slyde-server.workspace = true
slyde-export.workspace = true
slyde-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
# Embeds the Windows icon and version info. MIT/Apache-2.0, tiny, maintained; it is
# only used when the target is Windows and degrades to a warning without a resource
# compiler.
embed-resource = "3"
