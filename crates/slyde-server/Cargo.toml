[package]
name = "slyde-server"
description = "SlydeCode local HTTP/WS server, UI host, sandbox origin and Chrome launcher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
slyde-core.workspace = true
slyde-export.workspace = true
slyde-pptx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
futures-util.workspace = true
reqwest.workspace = true
base64.workspace = true
pdf-extract.workspace = true
# OS entropy for the session tokens (already in the tree through `uuid`).
getrandom.workspace = true
# Store-only ZIP for the per-slide PNG bundle. Deflate is enabled only so the
# copilot can read the XML inside DOCX/PPTX attachments; PNGs stay stored.
zip = { version = "2", default-features = false, features = ["deflate"] }

# OS credential store for provider keys (Credential Manager / Keychain). MIT or
# Apache-2.0, no C dependency. Linux keeps the owner-only file on purpose; see
# `copilot/vault.rs`.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
