[package]
name = "slyde-server"
description = "SlydeCode local HTTP/WS server, UI host, sandbox origin and Chrome launcher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
slyde-core.workspace = true
slyde-export.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
futures-util.workspace = true
# Store-only ZIP for the per-slide PNG bundle. PNGs are already compressed, so
# deflate would burn CPU for no size win; default features stay off.
zip = { version = "2", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
