[package]
name = "slyde-server"
description = "SlydeCode local HTTP/WS server, UI host, sandbox origin and Chrome launcher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
slyde-core.workspace = true
slyde-export.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
futures-util.workspace = true
reqwest.workspace = true
base64.workspace = true
pdf-extract.workspace = true
# Store-only ZIP for the per-slide PNG bundle. Deflate is enabled only so the
# copilot can read the XML inside DOCX/PPTX attachments; PNGs stay stored.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
