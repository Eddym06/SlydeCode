<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SlydeCode — Present</title>
  <link rel="icon" type="image/png" href="/static/logo-icon.png">
  <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/present.css">
</head>
<body class="present-standalone">
  <main class="present" id="present">
    <div class="present-frame" id="present-frame">
      <iframe id="present-slide" sandbox="allow-scripts" data-i18n-title="a11y.slideCanvas" title="Current slide"></iframe>
    </div>
    <div class="present-empty" id="present-empty" role="status" hidden>
      <p data-i18n="present.empty">No slides yet. Add one in the studio.</p>
    </div>
  </main>

  <div class="hud" id="hud">
    <div class="hud-count" role="status" aria-live="polite"><span id="current">1</span><span class="hud-sep">/</span><span id="total">1</span></div>
    <div class="hud-hint" id="hud-hint">
      <kbd>←</kbd><kbd>→</kbd> <span data-i18n="present.navigate">navigate</span>
      <span class="hud-dot">·</span>
      <kbd>S</kbd> <span id="hud-speaker" data-i18n="present.speakerMode">Speaker notes</span>
      <span class="hud-dot">·</span>
      <kbd>F</kbd> <span data-i18n="present.fullscreen">fullscreen</span>
      <span class="hud-dot">·</span>
      <kbd>B</kbd> <span data-i18n="present.blackout">blank</span>
      <span class="hud-dot">·</span>
      <kbd>Esc</kbd> <span data-i18n="present.exit">exit</span>
    </div>
    <button type="button" class="hud-exit-btn" id="hud-exit" data-i18n="present.exit">Exit</button>
  </div>

  <div class="speaker-console" id="speaker-console" hidden>
    <header class="speaker-top">
      <div class="speaker-brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="/static/logo-icon.png" class="brand-logo-img" alt="SlydeCode">
        </span>
        <span class="speaker-title" id="speaker-deck-title">SlydeCode</span>
      </div>
      <div class="speaker-clocks">
        <div class="speaker-clock">
          <span class="clock-label" data-i18n="present.clock">Clock</span>
          <span class="clock-time" id="wall-clock">00:00:00</span>
        </div>
        <div class="speaker-timer">
          <span class="clock-label" data-i18n="present.timer">Timer</span>
          <span class="timer-digits" id="timer-display">00:00</span>
          <button type="button" class="speaker-btn speaker-btn-sm" id="timer-toggle">▶</button>
          <button type="button" class="speaker-btn speaker-btn-sm" id="timer-reset">↺</button>
        </div>
      </div>
      <div class="speaker-actions">
        <button type="button" class="speaker-btn" id="exit-speaker" data-i18n="present.standardMode">Slide view</button>
        <button type="button" class="speaker-btn speaker-btn-primary" id="speaker-close-btn" data-i18n="present.exit">Exit</button>
      </div>
    </header>

    <div class="speaker-body">
      <div class="speaker-col-slides">
        <div class="speaker-card current-card">
          <div class="speaker-card-head">
            <span class="badge" data-i18n="a11y.slideCanvas">Current slide</span>
            <span class="slide-num"><span id="sc-current">1</span> / <span id="sc-total">1</span></span>
          </div>
          <div class="speaker-stage-wrap">
            <iframe id="sc-current-frame" sandbox="allow-scripts" tabindex="-1" title="Current slide preview" aria-hidden="true"></iframe>
          </div>
        </div>
        <div class="speaker-card next-card">
          <div class="speaker-card-head">
            <span class="badge badge-subtle" data-i18n="present.nextSlide">Next slide</span>
          </div>
          <div class="speaker-next-wrap">
            <iframe id="sc-next-frame" sandbox="allow-scripts" tabindex="-1" title="Next slide preview" aria-hidden="true"></iframe>
            <div class="no-next-hint" id="no-next-hint" hidden>End of presentation</div>
          </div>
        </div>
      </div>

      <div class="speaker-col-notes">
        <div class="speaker-card notes-card">
          <div class="speaker-card-head">
            <span data-i18n="present.notesTitle">Speaker Notes</span>
            <div class="notes-font-controls">
              <button type="button" class="speaker-btn speaker-btn-sm" id="notes-font-down">A-</button>
              <button type="button" class="speaker-btn speaker-btn-sm" id="notes-font-up">A+</button>
            </div>
          </div>
          <div class="speaker-notes-content" id="speaker-notes-body"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="progress" id="progress" role="progressbar" data-i18n-aria="present.progress"
       aria-label="Presentation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <span id="progress-fill"></span>
  </div>

  <script type="module" src="/static/present.js"></script>
</body>
</html>
